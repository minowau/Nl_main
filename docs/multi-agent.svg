<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 820" width="1280" height="820" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CBD5E1" opacity="0.65"/>
    </pattern>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#D97706"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0284C7"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#10B981"/>
    </marker>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#64748B"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect width="1280" height="820" fill="#F8FAFC"/>
  <rect width="1280" height="820" fill="url(#dots)"/>

  <!-- Header -->
  <text x="56" y="52" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Multi-Agent &amp; RL Architecture</text>
  <text x="56" y="78" font-size="14" font-weight="500" fill="#64748B">Two AI teams working together: the RL Engine picks WHAT to learn next, and the Orchestrator picks HOW to study it</text>

  <!-- ==================== TOP: STUDENT NODE ==================== -->
  <g filter="url(#shadow)">
    <rect x="440" y="106" width="400" height="84" rx="20" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2"/>
  </g>
  <rect x="462" y="124" width="48" height="48" rx="14" fill="#E0F2FE"/>
  <g transform="translate(474, 136)" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
    <circle cx="12" cy="7" r="4"/>
  </g>
  <text x="526" y="144" font-size="16" font-weight="800" fill="#0F172A">Student Learner</text>
  <text x="526" y="166" font-size="12.5" fill="#475569">Watches a lesson • Writes a summary • Opens Study Helper</text>

  <!-- Arrows from Student to Left & Right Pillars -->
  <path d="M 440 148 L 245 148 L 245 224" stroke="#D97706" stroke-width="2.5" fill="none" marker-end="url(#arrow-amber)"/>
  <rect x="268" y="136" width="144" height="24" rx="12" fill="#FEF3C7"/>
  <text x="340" y="152" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle">1. Submits Summary</text>

  <path d="M 840 148 L 930 148 L 930 224" stroke="#0284C7" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="852" y="136" width="150" height="24" rx="12" fill="#E0F2FE"/>
  <text x="927" y="152" font-size="11" font-weight="700" fill="#0284C7" text-anchor="middle">2. Opens Study Agent</text>

  <!-- ==================== LEFT PILLAR: RL NAVIGATION AGENT ==================== -->
  <rect x="48" y="232" width="394" height="432" rx="24" fill="#FFFBEB" fill-opacity="0.7" stroke="#FCD34D" stroke-width="2"/>
  <rect x="72" y="218" width="256" height="28" rx="14" fill="#D97706"/>
  <text x="200" y="237" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">🧭 RL NAVIGATION TEAM ("WHAT NEXT")</text>

  <!-- Step 1: Summary Evaluator -->
  <g filter="url(#shadow)">
    <rect x="72" y="264" width="346" height="96" rx="16" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  </g>
  <rect x="90" y="286" width="42" height="42" rx="12" fill="#FEF3C7"/>
  <g transform="translate(99, 295)" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="8" y1="13" x2="16" y2="13"/>
    <line x1="8" y1="17" x2="13" y2="17"/>
  </g>
  <text x="146" y="298" font-size="14" font-weight="800" fill="#0F172A">1. Summary Grader Agent</text>
  <text x="146" y="317" font-size="12" fill="#475569">Reads student's summary using BERT</text>
  <text x="146" y="335" font-size="11.5" font-weight="600" fill="#B45309">Outputs mastery score per topic</text>

  <path d="M 245 360 L 245 384" stroke="#D97706" stroke-width="2.2" fill="none" marker-end="url(#arrow-amber)"/>

  <!-- Step 2: Map & Persona Agent -->
  <g filter="url(#shadow)">
    <rect x="72" y="392" width="346" height="96" rx="16" fill="#FFFFFF" stroke="#FDE68A" stroke-width="1.5"/>
  </g>
  <rect x="90" y="414" width="42" height="42" rx="12" fill="#FEF3C7"/>
  <g transform="translate(99, 423)" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
    <circle cx="12" cy="10" r="3"/>
  </g>
  <text x="146" y="426" font-size="14" font-weight="800" fill="#0F172A">2. Map &amp; Persona Agent</text>
  <text x="146" y="445" font-size="12" fill="#475569">Moves student on the 20×20 grid</text>
  <text x="146" y="463" font-size="11.5" font-weight="600" fill="#B45309">Identifies 1 of 7 learning styles</text>

  <path d="M 245 488 L 245 512" stroke="#D97706" stroke-width="2.2" fill="none" marker-end="url(#arrow-amber)"/>

  <!-- Step 3: RL Recommender -->
  <g filter="url(#shadow)">
    <rect x="72" y="520" width="346" height="120" rx="16" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  </g>
  <rect x="90" y="544" width="42" height="42" rx="12" fill="#FEF3C7"/>
  <g transform="translate(99, 553)" stroke="#D97706" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="10"/>
    <polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>
  </g>
  <text x="146" y="554" font-size="14.5" font-weight="800" fill="#0F172A">3. RL Navigator Agent (DQN)</text>
  <text x="146" y="574" font-size="12" fill="#475569">Neural policy picks best next lesson</text>
  <text x="146" y="593" font-size="11.5" font-weight="600" fill="#B45309">Triggers Next Lesson Alert &amp; Map Pin</text>
  <rect x="146" y="605" width="252" height="22" rx="6" fill="#FEF3C7"/>
  <text x="272" y="620" font-size="10.5" font-weight="700" fill="#92400E" text-anchor="middle">Shares active lesson with Orchestrator →</text>

  <!-- Connection from RL Agent to Orchestrator -->
  <path d="M 418 580 L 478 580 L 478 308 L 560 308" stroke="#D97706" stroke-width="2.2" stroke-dasharray="6 4" fill="none" marker-end="url(#arrow-blue)"/>
  <rect x="444" y="424" width="68" height="36" rx="8" fill="#FFFFFF" stroke="#FCD34D" stroke-width="1.2"/>
  <text x="478" y="440" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">Passes</text>
  <text x="478" y="453" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">Lesson</text>

  <!-- ==================== RIGHT PILLAR: HIERARCHICAL MULTI-AGENT STUDY TEAM ==================== -->
  <rect x="526" y="232" width="706" height="432" rx="24" fill="#F0F9FF" fill-opacity="0.7" stroke="#7DD3FC" stroke-width="2"/>
  <rect x="550" y="218" width="320" height="28" rx="14" fill="#0284C7"/>
  <text x="710" y="237" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">🤖 HIERARCHICAL STUDY TEAM ("HOW TO LEARN")</text>

  <!-- MAIN ORCHESTRATOR AGENT -->
  <g filter="url(#shadow)">
    <rect x="568" y="262" width="622" height="112" rx="18" fill="#FFFFFF" stroke="#0EA5E9" stroke-width="2.2"/>
  </g>
  <rect x="592" y="290" width="52" height="52" rx="14" fill="#E0F2FE"/>
  <g transform="translate(606, 304)" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.79 1 1.51 1H21a2 2 0 0 1 0 4h-.09c-.72 0-1.25.4-1.51 1z"/>
  </g>
  <text x="662" y="294" font-size="16" font-weight="800" fill="#0F172A">Main Orchestrator Agent (Supervisor)</text>
  <text x="662" y="315" font-size="12.5" fill="#475569">• Checks current lesson, difficulty (1–7), topic type, and student history</text>
  <text x="662" y="335" font-size="12.5" fill="#475569">• Picks the best PRIMARY helper agent and gives custom tasks to all 4 subagents</text>
  <rect x="662" y="346" width="230" height="20" rx="6" fill="#E0F2FE"/>
  <text x="777" y="360" font-size="10.5" font-weight="700" fill="#0284C7" text-anchor="middle">Assigns Roles &amp; Oversees Output</text>

  <!-- Fan-out Lines from Orchestrator to 4 Subagents -->
  <path d="M 879 374 L 879 406" stroke="#10B981" stroke-width="2.2" fill="none"/>
  <path d="M 628 406 L 1130 406" stroke="#10B981" stroke-width="2.2" fill="none"/>
  <path d="M 628 406 L 628 434" stroke="#10B981" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 795 406 L 795 434" stroke="#10B981" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 963 406 L 963 434" stroke="#10B981" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>
  <path d="M 1130 406 L 1130 434" stroke="#10B981" stroke-width="2.2" fill="none" marker-end="url(#arrow-green)"/>

  <rect x="784" y="394" width="190" height="22" rx="11" fill="#D1FAE5" stroke="#6EE7B7" stroke-width="1"/>
  <text x="879" y="409" font-size="10.5" font-weight="700" fill="#065F46" text-anchor="middle">Delegates Custom Tasks</text>

  <!-- SUBAGENT 1: CONCEPT COACH -->
  <g filter="url(#shadow)">
    <rect x="554" y="442" width="148" height="198" rx="16" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  </g>
  <rect x="606" y="460" width="44" height="44" rx="12" fill="#D1FAE5"/>
  <g transform="translate(616, 470)" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18h6"/>
    <path d="M10 22h4"/>
    <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>
  </g>
  <text x="628" y="528" font-size="13.5" font-weight="800" fill="#0F172A" text-anchor="middle">Concept Coach</text>
  <text x="628" y="550" font-size="11" fill="#475569" text-anchor="middle">Simple intuition,</text>
  <text x="628" y="566" font-size="11" fill="#475569" text-anchor="middle">real-world analogies,</text>
  <text x="628" y="582" font-size="11" fill="#475569" text-anchor="middle">&amp; step-by-step</text>
  <text x="628" y="598" font-size="11" fill="#475569" text-anchor="middle">breakdowns</text>
  <rect x="572" y="612" width="112" height="18" rx="6" fill="#ECFDF5"/>
  <text x="628" y="625" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">Best for Hard Topics</text>

  <!-- SUBAGENT 2: SMART NOTES -->
  <g filter="url(#shadow)">
    <rect x="721" y="442" width="148" height="198" rx="16" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  </g>
  <rect x="773" y="460" width="44" height="44" rx="12" fill="#D1FAE5"/>
  <g transform="translate(783, 470)" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
    <polyline points="14 2 14 8 20 8"/>
    <line x1="16" y1="13" x2="8" y2="13"/>
    <line x1="16" y1="17" x2="8" y2="17"/>
  </g>
  <text x="795" y="528" font-size="13.5" font-weight="800" fill="#0F172A" text-anchor="middle">Smart Notes</text>
  <text x="795" y="550" font-size="11" fill="#475569" text-anchor="middle">Short overview,</text>
  <text x="795" y="566" font-size="11" fill="#475569" text-anchor="middle">5 key takeaways,</text>
  <text x="795" y="582" font-size="11" fill="#475569" text-anchor="middle">&amp; 1-click save to</text>
  <text x="795" y="598" font-size="11" fill="#475569" text-anchor="middle">Knowledge Hub</text>
  <rect x="739" y="612" width="112" height="18" rx="6" fill="#ECFDF5"/>
  <text x="795" y="625" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">Best for New Lessons</text>

  <!-- SUBAGENT 3: FLASHCARDS -->
  <g filter="url(#shadow)">
    <rect x="889" y="442" width="148" height="198" rx="16" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  </g>
  <rect x="941" y="460" width="44" height="44" rx="12" fill="#D1FAE5"/>
  <g transform="translate(951, 470)" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="16" height="14" rx="2"/>
    <path d="M6 2h12a2 2 0 0 1 2 2v12"/>
  </g>
  <text x="963" y="528" font-size="13.5" font-weight="800" fill="#0F172A" text-anchor="middle">Flashcards</text>
  <text x="963" y="550" font-size="11" fill="#475569" text-anchor="middle">6 interactive</text>
  <text x="963" y="566" font-size="11" fill="#475569" text-anchor="middle">flip-cards for</text>
  <text x="963" y="582" font-size="11" fill="#475569" text-anchor="middle">key terms &amp;</text>
  <text x="963" y="598" font-size="11" fill="#475569" text-anchor="middle">fast recall</text>
  <rect x="907" y="612" width="112" height="18" rx="6" fill="#ECFDF5"/>
  <text x="963" y="625" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">Best for Revision</text>

  <!-- SUBAGENT 4: ADAPTIVE QUIZ -->
  <g filter="url(#shadow)">
    <rect x="1056" y="442" width="148" height="198" rx="16" fill="#FFFFFF" stroke="#6EE7B7" stroke-width="1.5"/>
  </g>
  <rect x="1108" y="460" width="44" height="44" rx="12" fill="#D1FAE5"/>
  <g transform="translate(1118, 470)" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 11l3 3L22 4"/>
    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
  </g>
  <text x="1130" y="528" font-size="13.5" font-weight="800" fill="#0F172A" text-anchor="middle">Concept Quiz</text>
  <text x="1130" y="550" font-size="11" fill="#475569" text-anchor="middle">Multiple-choice</text>
  <text x="1130" y="566" font-size="11" fill="#475569" text-anchor="middle">questions, live</text>
  <text x="1130" y="582" font-size="11" fill="#475569" text-anchor="middle">score &amp; clear</text>
  <text x="1130" y="598" font-size="11" fill="#475569" text-anchor="middle">explanations</text>
  <rect x="1074" y="612" width="112" height="18" rx="6" fill="#ECFDF5"/>
  <text x="1130" y="625" font-size="9.5" font-weight="700" fill="#059669" text-anchor="middle">Best for Self-Check</text>

  <!-- ==================== BOTTOM: SHARED AI & MEMORY LAYER ==================== -->
  <g filter="url(#shadow)">
    <rect x="48" y="698" width="1184" height="92" rx="18" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  </g>

  <!-- Shared Item 1: Groq Cloud LLM -->
  <rect x="72" y="720" width="46" height="46" rx="12" fill="#EDE9FE"/>
  <g transform="translate(83, 731)" stroke="#7C3AED" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
  </g>
  <text x="132" y="739" font-size="14" font-weight="800" fill="#0F172A">Groq Cloud LLM</text>
  <text x="132" y="758" font-size="12" fill="#64748B">Free-tier AI + automatic offline backup</text>

  <line x1="430" y1="714" x2="430" y2="774" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Shared Item 2: Course Knowledge Base -->
  <rect x="458" y="720" width="46" height="46" rx="12" fill="#E0F2FE"/>
  <g transform="translate(469, 731)" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
  </g>
  <text x="518" y="739" font-size="14" font-weight="800" fill="#0F172A">Course Knowledge Base</text>
  <text x="518" y="758" font-size="12" fill="#64748B">19 NLP modules, glossaries &amp; video transcripts</text>

  <line x1="840" y1="714" x2="840" y2="774" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Shared Item 3: PostgreSQL Memory -->
  <rect x="868" y="720" width="46" height="46" rx="12" fill="#FCE7F3"/>
  <g transform="translate(879, 731)" stroke="#DB2777" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
  </g>
  <text x="928" y="739" font-size="14" font-weight="800" fill="#0F172A">PostgreSQL Shared Memory</text>
  <text x="928" y="758" font-size="12" fill="#64748B">Saves coordinates, notes, quizzes &amp; history</text>

  <!-- Vertical Connectors to Shared Bottom Bar -->
  <path d="M 245 664 L 245 690" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow-slate)" marker-start="url(#arrow-slate)"/>
  <path d="M 879 664 L 879 690" stroke="#64748B" stroke-width="2" fill="none" marker-end="url(#arrow-slate)" marker-start="url(#arrow-slate)"/>
</svg>
