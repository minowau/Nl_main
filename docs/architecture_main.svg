<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Soft Card Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#0F172A" flood-opacity="0.05"/>
    </filter>
    <!-- Subtle Dot Pattern -->
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#CBD5E1" opacity="0.65"/>
    </pattern>
    <!-- Arrowheads -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#0EA5E9"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#EC4899"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#8B5CF6"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1280" height="760" fill="#F8FAFC"/>
  <rect width="1280" height="760" fill="url(#dots)"/>

  <!-- Header -->
  <text x="56" y="54" font-size="26" font-weight="800" fill="#0F172A" letter-spacing="-0.5">Navigated Learning — System Architecture</text>
  <text x="56" y="80" font-size="14" font-weight="500" fill="#64748B">How the browser, Dockerized AI backend, PostgreSQL database, and cloud services connect</text>

  <!-- Step Pills in Header -->
  <rect x="975" y="40" width="250" height="36" rx="18" fill="#E0F2FE" stroke="#BAE6FD" stroke-width="1.5"/>
  <text x="1100" y="63" font-size="12" font-weight="700" fill="#0284C7" text-anchor="middle">Single Command: docker compose up</text>

  <!-- ==================== COLUMN 1: USER & BROWSER ==================== -->
  <g filter="url(#shadow)">
    <rect x="48" y="128" width="256" height="560" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <!-- Top Accent Bar -->
  <rect x="48" y="128" width="256" height="8" rx="4" fill="#0EA5E9"/>

  <!-- Icon Badge: Monitor -->
  <rect x="72" y="156" width="44" height="44" rx="12" fill="#E0F2FE"/>
  <g transform="translate(82, 166)" stroke="#0284C7" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="3" width="20" height="14" rx="2"/>
    <line x1="8" y1="21" x2="16" y2="21"/>
    <line x1="12" y1="17" x2="12" y2="21"/>
  </g>
  <text x="128" y="175" font-size="16" font-weight="800" fill="#0F172A">1. Student Browser</text>
  <text x="128" y="194" font-size="12" font-weight="600" fill="#0284C7">React + TypeScript App</text>

  <!-- Sub-card 1: Login & Dashboard -->
  <rect x="68" y="224" width="216" height="96" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <circle cx="92" cy="252" r="14" fill="#DBEAFE"/>
  <g transform="translate(84, 244)" stroke="#2563EB" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 11a3 3 0 1 0-6 0 3 3 0 0 0 6 0z" transform="translate(-1,-2)"/>
    <path d="M3 15c0-2.5 3-4 5-4s5 1.5 5 4"/>
  </g>
  <text x="116" y="250" font-size="13" font-weight="700" fill="#1E293B">Login &amp; Home</text>
  <text x="116" y="268" font-size="11.5" fill="#64748B">Sign in, view progress,</text>
  <text x="116" y="284" font-size="11.5" fill="#64748B">&amp; open Knowledge Hub</text>

  <!-- Sub-card 2: 20x20 Matrix -->
  <rect x="68" y="336" width="216" height="122" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
  <circle cx="92" cy="364" r="14" fill="#BAE6FD"/>
  <g transform="translate(84, 356)" stroke="#0284C7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="1" y="1" width="6" height="6" rx="1"/>
    <rect x="9" y="1" width="6" height="6" rx="1"/>
    <rect x="1" y="9" width="6" height="6" rx="1"/>
    <rect x="9" y="9" width="6" height="6" rx="1"/>
  </g>
  <text x="116" y="362" font-size="13" font-weight="700" fill="#0F172A">20×20 Learning Map</text>
  <text x="116" y="381" font-size="11.5" fill="#475569">• Zoom &amp; drag across grid</text>
  <text x="116" y="398" font-size="11.5" fill="#475569">• Watch lecture videos</text>
  <text x="116" y="415" font-size="11.5" fill="#475569">• Write lesson summaries</text>
  <text x="116" y="432" font-size="11.5" fill="#0284C7" font-weight="600">• See Next Lesson Alert</text>

  <!-- Sub-card 3: AI Study Modal -->
  <rect x="68" y="474" width="216" height="100" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/>
  <circle cx="92" cy="502" r="14" fill="#E0E7FF"/>
  <g transform="translate(84, 494)" stroke="#4F46E5" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4"/>
  </g>
  <text x="116" y="500" font-size="13" font-weight="700" fill="#1E293B">AI Study Helper</text>
  <text x="116" y="519" font-size="11.5" fill="#64748B">Concept Coach, Smart Notes,</text>
  <text x="116" y="535" font-size="11.5" fill="#64748B">Flashcards, Quizzes &amp; Q&amp;A</text>

  <!-- Footer tag -->
  <rect x="68" y="606" width="216" height="58" rx="12" fill="#F1F5F9"/>
  <text x="176" y="631" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Built with Vite &amp; Tailwind CSS</text>
  <text x="176" y="649" font-size="11" fill="#64748B" text-anchor="middle">Runs at http://localhost:5000</text>

  <!-- ==================== DOCKER COMPOSE WRAPPER ==================== -->
  <rect x="356" y="108" width="632" height="604" rx="26" fill="#FFFFFF" fill-opacity="0.45" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="380" y="95" width="218" height="26" rx="13" fill="#0F172A"/>
  <text x="489" y="112" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">🐳 Docker Compose Environment</text>

  <!-- ==================== COLUMN 2: BACKEND CONTAINER ==================== -->
  <g filter="url(#shadow)">
    <rect x="380" y="138" width="320" height="546" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <rect x="380" y="138" width="320" height="8" rx="4" fill="#10B981"/>

  <!-- Icon Badge: Server -->
  <rect x="404" y="164" width="44" height="44" rx="12" fill="#D1FAE5"/>
  <g transform="translate(414, 174)" stroke="#059669" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="20" height="8" rx="2"/>
    <rect x="2" y="14" width="20" height="8" rx="2"/>
    <line x1="6" y1="6" x2="6.01" y2="6"/>
    <line x1="6" y1="18" x2="6.01" y2="18"/>
  </g>
  <text x="460" y="182" font-size="16" font-weight="800" fill="#0F172A">2. Backend &amp; AI Server</text>
  <text x="460" y="201" font-size="12" font-weight="600" fill="#059669">Flask + Gunicorn (Port 5000)</text>

  <!-- Block A: API Gateway -->
  <rect x="400" y="228" width="280" height="82" rx="14" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.2"/>
  <text x="418" y="252" font-size="13" font-weight="700" fill="#065F46">REST API &amp; Auth Layer</text>
  <text x="418" y="271" font-size="11.5" fill="#047857">• Serves React app &amp; /api/* routes</text>
  <text x="418" y="288" font-size="11.5" fill="#047857">• Login tokens, notes, bookmarks &amp; reset</text>

  <!-- Block B: RL & NLP Engine -->
  <rect x="400" y="326" width="280" height="148" rx="14" fill="#FFFBEB" stroke="#FDE68A" stroke-width="1.2"/>
  <circle cx="424" cy="354" r="14" fill="#FEF3C7"/>
  <g transform="translate(416, 346)" stroke="#D97706" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="8" r="6"/>
    <path d="M8 5v3l2 2"/>
  </g>
  <text x="448" y="358" font-size="13" font-weight="700" fill="#78350F">RL &amp; Understanding Engine</text>
  <text x="418" y="384" font-size="11.5" fill="#92400E">1. BERT grades student summaries</text>
  <text x="418" y="403" font-size="11.5" fill="#92400E">2. Radial Mapper updates (x, y) coords</text>
  <text x="418" y="422" font-size="11.5" fill="#92400E">3. PyTorch DQN picks next best lesson</text>
  <text x="418" y="441" font-size="11.5" fill="#92400E">4. GMM assigns 1 of 7 learning personas</text>
  <rect x="418" y="450" width="244" height="16" rx="4" fill="#FEF3C7"/>
  <text x="540" y="462" font-size="10" font-weight="700" fill="#B45309" text-anchor="middle">Local Models: MiniLM + PyTorch + Scikit-learn</text>

  <!-- Block C: Multi-Agent Study Engine -->
  <rect x="400" y="490" width="280" height="114" rx="14" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1.2"/>
  <circle cx="424" cy="518" r="14" fill="#E0F2FE"/>
  <g transform="translate(416, 510)" stroke="#0284C7" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="4" width="12" height="9" rx="2"/>
    <path d="M8 1v3M5 8h.01M11 8h.01"/>
  </g>
  <text x="448" y="522" font-size="13" font-weight="700" fill="#0C4A6E">Multi-Agent Study System</text>
  <text x="418" y="546" font-size="11.5" fill="#0369A1">• Main Orchestrator routes tasks</text>
  <text x="418" y="564" font-size="11.5" fill="#0369A1">• Runs Coach, Notes, Flashcards, Quiz</text>
  <text x="418" y="582" font-size="11.5" fill="#0369A1">• Built-in offline fallback if no API key</text>

  <!-- Env Pill -->
  <rect x="400" y="620" width="280" height="44" rx="12" fill="#F1F5F9"/>
  <text x="540" y="640" font-size="11.5" font-weight="700" fill="#334155" text-anchor="middle">Reads .env (GROQ_API_KEY)</text>
  <text x="540" y="655" font-size="10.5" fill="#64748B" text-anchor="middle">Live-mounted ./backend &amp; ./dist folders</text>

  <!-- ==================== COLUMN 3: POSTGRESQL DATABASE ==================== -->
  <g filter="url(#shadow)">
    <rect x="736" y="138" width="232" height="546" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <rect x="736" y="138" width="232" height="8" rx="4" fill="#EC4899"/>

  <!-- Icon Badge: Database -->
  <rect x="760" y="164" width="44" height="44" rx="12" fill="#FCE7F3"/>
  <g transform="translate(770, 174)" stroke="#DB2777" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="12" cy="5" rx="9" ry="3"/>
    <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/>
    <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/>
  </g>
  <text x="816" y="182" font-size="16" font-weight="800" fill="#0F172A">3. Database</text>
  <text x="816" y="201" font-size="12" font-weight="600" fill="#DB2777">PostgreSQL 16 (:5432)</text>

  <!-- DB Table Groups -->
  <rect x="756" y="228" width="192" height="86" rx="14" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.2"/>
  <text x="772" y="252" font-size="12.5" font-weight="700" fill="#831843">Users &amp; Sessions</text>
  <text x="772" y="272" font-size="11.5" fill="#9D174D">• Accounts &amp; login tokens</text>
  <text x="772" y="290" font-size="11.5" fill="#9D174D">• Grid (x, y), XP &amp; visits</text>

  <rect x="756" y="330" width="192" height="104" rx="14" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.2"/>
  <text x="772" y="354" font-size="12.5" font-weight="700" fill="#831843">Learning &amp; RL Data</text>
  <text x="772" y="374" font-size="11.5" fill="#9D174D">• Student summaries</text>
  <text x="772" y="392" font-size="11.5" fill="#9D174D">• Mastery path polylines</text>
  <text x="772" y="410" font-size="11.5" fill="#9D174D">• Next-lesson picks</text>

  <rect x="756" y="450" width="192" height="104" rx="14" fill="#FDF2F8" stroke="#FBCFE8" stroke-width="1.2"/>
  <text x="772" y="474" font-size="12.5" font-weight="700" fill="#831843">Study Content</text>
  <text x="772" y="494" font-size="11.5" fill="#9D174D">• 19 course modules</text>
  <text x="772" y="512" font-size="11.5" fill="#9D174D">• Saved notes &amp; bookmarks</text>
  <text x="772" y="530" font-size="11.5" fill="#9D174D">• Video transcripts</text>

  <rect x="756" y="570" width="192" height="94" rx="14" fill="#F1F5F9"/>
  <text x="852" y="598" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">History Archive</text>
  <text x="852" y="618" font-size="11" fill="#64748B" text-anchor="middle">Saves past journeys on reset</text>
  <text x="852" y="642" font-size="10.5" font-weight="600" fill="#DB2777" text-anchor="middle">Volume: postgres-data</text>

  <!-- ==================== COLUMN 4: EXTERNAL CLOUD SERVICES ==================== -->
  <!-- Groq Card -->
  <g filter="url(#shadow)">
    <rect x="1034" y="196" width="204" height="200" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <rect x="1034" y="196" width="204" height="8" rx="4" fill="#8B5CF6"/>
  <rect x="1056" y="224" width="42" height="42" rx="12" fill="#EDE9FE"/>
  <g transform="translate(1065, 233)" stroke="#7C3AED" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
  </g>
  <text x="1110" y="242" font-size="15" font-weight="800" fill="#0F172A">Groq AI</text>
  <text x="1110" y="260" font-size="11.5" font-weight="600" fill="#7C3AED">Cloud LLM API</text>
  <text x="1056" y="294" font-size="11.5" fill="#475569">• Powers Orchestrator</text>
  <text x="1056" y="314" font-size="11.5" fill="#475569">• Runs 4 Study Agents</text>
  <text x="1056" y="334" font-size="11.5" fill="#475569">• Auto-picks best model</text>
  <rect x="1056" y="352" width="160" height="24" rx="8" fill="#F5F3FF"/>
  <text x="1136" y="368" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">Free Tier • Auto Fallback</text>

  <!-- YouTube Card -->
  <g filter="url(#shadow)">
    <rect x="1034" y="438" width="204" height="176" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
  </g>
  <rect x="1034" y="438" width="204" height="8" rx="4" fill="#EF4444"/>
  <rect x="1056" y="466" width="42" height="42" rx="12" fill="#FEE2E2"/>
  <g transform="translate(1065, 475)" stroke="#DC2626" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="5 3 19 12 5 21 5 3"/>
  </g>
  <text x="1110" y="484" font-size="15" font-weight="800" fill="#0F172A">YouTube</text>
  <text x="1110" y="502" font-size="11.5" font-weight="600" fill="#DC2626">Video Lectures</text>
  <text x="1056" y="536" font-size="11.5" fill="#475569">• Embedded video player</text>
  <text x="1056" y="556" font-size="11.5" fill="#475569">• Lesson thumbnails</text>
  <text x="1056" y="576" font-size="11.5" fill="#475569">• Transcript-based Q&amp;A</text>

  <!-- ==================== ARROWS & LABELS ==================== -->
  <!-- Browser <-> Backend -->
  <path d="M 304 388 L 372 388" stroke="#0EA5E9" stroke-width="2.5" fill="none" marker-end="url(#arrow-blue)" marker-start="url(#arrow-blue)"/>
  <rect x="308" y="354" width="60" height="22" rx="6" fill="#E0F2FE"/>
  <text x="338" y="369" font-size="10.5" font-weight="700" fill="#0284C7" text-anchor="middle">REST API</text>

  <!-- Backend <-> Database -->
  <path d="M 700 388 L 728 388" stroke="#EC4899" stroke-width="2.5" fill="none" marker-end="url(#arrow-pink)" marker-start="url(#arrow-pink)"/>
  <rect x="692" y="354" width="52" height="22" rx="6" fill="#FCE7F3"/>
  <text x="718" y="369" font-size="10.5" font-weight="700" fill="#DB2777" text-anchor="middle">SQL</text>

  <!-- Backend <-> Groq -->
  <path d="M 700 546 L 1008 546 L 1008 296 L 1026 296" stroke="#8B5CF6" stroke-width="2.2" fill="none" marker-end="url(#arrow-purple)"/>
  <rect x="974" y="254" width="66" height="22" rx="6" fill="#EDE9FE"/>
  <text x="1007" y="269" font-size="10.5" font-weight="700" fill="#6D28D9" text-anchor="middle">HTTPS AI</text>

  <!-- Browser -> YouTube (along bottom) -->
  <path d="M 176 688 L 176 728 L 1136 728 L 1136 622" stroke="#EF4444" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <rect x="596" y="716" width="160" height="24" rx="12" fill="#FEE2E2"/>
  <text x="676" y="732" font-size="11" font-weight="700" fill="#DC2626" text-anchor="middle">Streams Lecture Videos</text>
